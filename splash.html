<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerixID · Escudo Oficial</title>
    <style>
        body { margin: 0; height: 100vh; background: #0B1120; color: #F8FAFC; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .escudo { width: 92px; height: 92px; border-radius: 26px; background: rgba(16,185,129,0.12); border: 2px solid #10B981; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 35px rgba(16,185,129,0.35); animation: pulso 1.4s ease-out forwards; }
        svg { width: 46px; height: 46px; stroke: #10B981; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .arco { stroke-dasharray: 40; stroke-dashoffset: 14; animation: cerrar 0.8s ease-out 0.3s forwards; }
        h1 { margin: 20px 0 6px; font-size: 24px; letter-spacing: 2px; color: #10B981; }
        p { margin: 0; font-size: 13px; color: #94A3B8; letter-spacing: 0.5px; }
        @keyframes cerrar { to { stroke-dashoffset: 0; } }
        @keyframes pulso { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="escudo">
        <svg viewBox="0 0 24 24">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path class="arco" d="M8 11V7a4 4 0 0 1 8 0v4"/>
            <circle cx="12" cy="16" r="1.2" fill="#10B981"/>
        </svg>
    </div>
    <h1>VERIXID</h1>
    <p>Identidad Digital Blindada</p>
    <script>
        setTimeout(function() {
            const p = localStorage.getItem("verixid_mi_perfil");
            window.location.replace(p ? "/v/" + p : "/v/maria-perez");
        }, 1600);
    </script>
</body>
</html>
